# On a version tag (v1.2.0): build both single-file pages and attach them to a GitHub release, for use offline.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run build
      - name: Attach the pages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" a380/a380.html a380/a380-light.html --clobber
