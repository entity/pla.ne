# Deploy https://air.pla.ne from main (npm run deploy: build the site, upload it with wrangler). Needs the repository
# secrets CLOUDFLARE_API_TOKEN (Workers Scripts and Workers Routes edit, Zone read) and CLOUDFLARE_ACCOUNT_ID; without
# them the job is skipped. The link-preview images are captured in headless Chrome on SwiftShader (no GPU here).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; nothing deployed."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Build and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          DRIVE_ANGLE: swiftshader
        run: npm run deploy
